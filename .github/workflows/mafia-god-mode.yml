name: mafia-god-mode
on:
  push:
    paths: ["mafia-god-mode/**", ".github/workflows/mafia-god-mode.yml"]
  pull_request:
    paths: ["mafia-god-mode/**", ".github/workflows/mafia-god-mode.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mafia-god-mode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mafia-god-mode/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
